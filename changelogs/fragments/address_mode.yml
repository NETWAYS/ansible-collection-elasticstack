minor_changes:
  - The new ``elasticstack_address_mode`` selects how the Ansible roles address a host of the
    elasticsearch, logstash or kibana inventory group. ``inventory`` keeps the name from the
    inventory as before, ``fqdn``, ``hostname`` and ``ip`` take the address from the facts of that
    host. Each host is addressed in the mode set for it in the inventory, in group_vars or
    host_vars, or with ``-e``; a value in the vars of a play or a role parameter stops the run
    with an error. Facts of those hosts that are missing, for example in a run limited with
    ``--limit``, are gathered first.
  - Setting ``elasticstack_node_address`` in the host_vars of a host makes the Ansible roles reach that
    host at this address, whatever ``elasticstack_address_mode`` says, for example through the
    IP of a particular network card. The address is also added to the certificate of an
    Elasticsearch host and to the certificate a Logstash host presents to the Beats. Existing
    certificates get it when they are renewed.

trivial:
  - The full stack Molecule scenario sets ``elasticstack_address_mode`` to ``ip`` in its inventory
    and no longer writes the container addresses into /etc/hosts.
