trivial:
  - The ``changelog_fragment`` check no longer rejects a release pull request. A release folds
    the fragments into ``changelogs/changelog.yaml`` and deletes them instead of adding one, so
    the check recognises that shape and skips itself.
  - RELEASE.md starts with cloning into a fresh directory now, because the changelog generation
    and the archive build both read the working directory and would pick up local leftovers.
