namespace: netways
name: elasticstack
version: 0.1.0
readme: README.md
authors:
  - NETWAYS GmbH (https://github.com/NETWAYS)
description: This collection installs and configures components from the Elastic Stack. Every role can be used standalone or in combination with other roles.
license:
  - GPL-3.0
# min_ansible_version: "2.18"  # max supported: 2.20 (commented out for schema compliance)
license_file: 'LICENSE'
tags:
  - elastic
  - elasticsearch
  - kibana
  - logstash
  - beat
  - metricbeat
  - filebeat
  - monitoring
dependencies:
  "community.general": "*"
repository: https://github.com/netways/ansible-collection-elasticstack
documentation: https://github.com/netways/ansible-collection-elasticstack/README.md
homepage: https://www.netways.de
issues: https://github.com/netways/ansible-collection-elasticstack/issues
build_ignore:
  # CI, tests and local tooling
  - .github
  - .cache
  - molecule
  - results-dir
  - .config
  - .yamllint
  - makefile
  - 'requirements*.txt'
  - .docsmith
  # repository housekeeping, not part of the collection
  - .gitignore
  - .mailmap
  - daemon.json
  - RELEASE.md
  # changelog working directory - the rendered CHANGELOG.md is shipped
  - changelogs
  # local editor and tool directories, never part of a release
  - .vscode
  - .idea
  - __pycache__
  - .ansible
  - 'venv*'
  - '*.tar.gz'
# Minimum Ansible version required: 2.14, maximum supported: 2.20
