namespace: netways
name: elasticstack
version: 0.1.0
readme: README.md
authors:
  - NETWAYS GmbH (https://github.com/NETWAYS)
description: This collection installs and configures components from the Elastic Stack.
license:
  - GPL-3.0
# min_ansible_version: "2.18"  # max supported: 2.20 (commented out for schema compliance)
license_file: 'LICENSE'
tags:
  - elastic
  - elasticsearch
  - kibana
  - logstash
  - beat
  - metricbeat
  - filebeat
  - monitoring
dependencies:
  "community.general": "*"
repository: https://github.com/netways/ansible-collection-elasticstack
documentation: https://github.com/netways/ansible-collection-elasticstack/README.md
homepage: https://www.netways.de
issues: https://github.com/netways/ansible-collection-elasticstack/issues
build_ignore:
  # CI, tests and local tooling
  - molecule
  - results-dir
  - makefile
  - 'requirements*.txt'
  # repository housekeeping, not part of the collection
  - daemon.json
  - RELEASE.md
  - CONTRIBUTING.md
  # The changelog working directory, used to build the CHANGELOG.md in the repository.
  - changelogs
  # no dot files or directories belong in a published collection
  - '.*'
  - __pycache__
  - 'venv*'
  - '*.tar.gz'
# Minimum Ansible version is declared in meta/runtime.yml (requires_ansible). Maximum tested: 2.20
