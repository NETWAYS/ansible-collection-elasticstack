---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: "kibana_default-${MOLECULE_DISTRO:-debian13}"
    groups:
      - elasticsearch
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-debian13}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - /tmp/elastic-apt-cache:/opt/elastic-apt-cache:ro
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  inventory:
    group_vars:
      all:
        # Not the default 5601, so the run shows that Kibana listens on the configured port
        elasticstack_kibana_port: 5602
verifier:
  name: ansible
