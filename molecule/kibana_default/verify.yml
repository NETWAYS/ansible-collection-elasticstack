---
- name: Verify Kibana deployment
  hosts: all
  tasks:
    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Assert Kibana service is running
      ansible.builtin.assert:
        that: ansible_facts.services['kibana.service'].state == 'running'
        fail_msg: "Kibana service is not running"

    - name: Wait for Kibana port to be available
      ansible.builtin.wait_for:
        port: "{{ elasticstack_kibana_port }}"
        timeout: 120

    # curl checks the served certificate against the test certificate from prepare.yml and fails
    # on any TLS error. The HTTP status does not matter, Kibana runs without Elasticsearch here.
    - name: Check that Kibana serves its own certificate over https
      ansible.builtin.command: >-
        curl -s -o /dev/null -w '%{http_code}'
        --cacert /etc/ssl/kibana-test.crt https://localhost:{{ elasticstack_kibana_port }}/api/status
      changed_when: false
