---
# Role argument specification for the beats role.
# This is the single source of truth for the role's variables: Ansible validates
# the supplied values against it at role start, and ansible-docsmith renders the
# README variable reference and the comments in defaults/main.yml from it.
#
# Only beats_* variables live here. The shared elasticstack_* variables are
# documented centrally with the elasticstack role.

argument_specs:
  main:
    short_description: Install and configure Elastic Beats
    description:
      - Installs and configures Filebeat, Auditbeat and Metricbeat on Linux systems.
      - >-
        Can run standalone or together with the other Elastic Stack roles. Beats
        can ship to Logstash or directly to Elasticsearch.
      - >-
        The complex Filebeat input structures (log, syslog, journald, docker,
        modules) are described in the Filebeat inputs documentation.
    author:
      - NETWAYS GmbH

    options:

      # ----- Which Beats to manage -----
      beats_filebeat:
        type: bool
        default: true
        description: Install and manage Filebeat.

      beats_auditbeat:
        type: bool
        default: false
        description: Install and manage Auditbeat.

      beats_metricbeat:
        type: bool
        default: false
        description: Install and manage Metricbeat.

      # ----- General -----
      beats_elasticsearch_hosts:
        type: list
        elements: str
        description: >-
          Elasticsearch hosts the Beats ship to. When elasticstack_full_stack is true and
          this variable is not set, the role fills it with the addresses of the hosts in the
          inventory group named in elasticstack_elasticsearch_group_name, picked by
          elasticstack_address_mode and elasticstack_node_address. When
          elasticstack_full_stack is false, set it yourself as soon as a Beat uses the
          elasticsearch output, otherwise the run stops.

      beats_logstash_hosts:
        type: list
        elements: str
        description: >-
          Logstash hosts the Beats ship to. When elasticstack_full_stack is true and this
          variable is not set, the role fills it with the addresses of the hosts in the
          inventory group named in elasticstack_logstash_group_name, picked by
          elasticstack_address_mode and elasticstack_node_address. When
          elasticstack_full_stack is false, set it yourself as soon as a Beat uses the
          logstash output, otherwise the run stops.

      beats_fields:
        type: list
        elements: str
        description: >-
          Global fields added to the log and syslog (tcp/udp) inputs (not to the
          mysql, journald or docker inputs), given as a list of "key: value"
          strings. This is the global counterpart to the per-input fields. Unset by
          default. See the Filebeat inputs documentation.

      # ----- Logging -----
      beats_logging:
        type: str
        default: file
        description: >-
          Where the Beats log. Set to "file" to log into beats_logpath; any other
          value leaves the Beats built-in logging.

      beats_loglevel:
        type: str
        default: info
        description: Log level for all Beats.

      beats_logpath:
        type: str
        default: /var/log/beats
        description: Directory for the log files when beats_logging is "file".

      # ----- Filebeat -----
      beats_filebeat_enable:
        type: bool
        default: true
        description: Start and enable the Filebeat service.

      beats_filebeat_output:
        type: str
        choices:
          - logstash
          - elasticsearch
        default: logstash
        description: >-
          Where Filebeat sends its events. With "logstash" they pass through the Logstash
          pipelines and can be filtered and enriched there, which is what log lines usually
          need. With "elasticsearch" they go straight into the cluster.

      beats_filebeat_elastic_monitoring:
        type: bool
        default: false
        description: Report Filebeat monitoring data through the Elastic Stack monitoring features.

      beats_filebeat_loadbalance:
        type: bool
        default: true
        description: Enable load balancing for the Filebeat Logstash output.

      beats_filebeat_log_input:
        type: bool
        default: true
        description: Read log files with the inputs from beats_filebeat_log_inputs.

      beats_filebeat_log_inputs:
        type: dict
        default:
          messages:
            paths:
              - /var/log/messages
              - /var/log/syslog
        description: >-
          Log files to read, keyed by a free name that becomes the filestream id.
          Each entry has paths and optional fields and multiline settings. See the
          Filebeat inputs documentation.

      beats_filebeat_take_over:
        type: bool
        default: false
        description: >-
          Set take_over on the filestream inputs from beats_filebeat_log_inputs and on
          the MySQL slow log input, so they continue at the read positions of the log
          inputs that older versions of this role generated instead of reading the
          files again. Only needed once when upgrading hosts that still have log inputs.
          See the Filebeat inputs documentation.

      beats_filebeat_syslog_tcp:
        type: bool
        default: false
        description: Enable a TCP syslog input.

      beats_filebeat_syslog_tcp_port:
        type: int
        default: 514
        description: Port of the TCP syslog input.

      beats_filebeat_syslog_udp:
        type: bool
        default: false
        description: Enable a UDP syslog input.

      beats_filebeat_syslog_udp_port:
        type: int
        default: 514
        description: Port of the UDP syslog input.

      beats_filebeat_journald:
        type: bool
        default: false
        description: Collect logs from journald. Available since Filebeat 7.16.

      beats_filebeat_journald_inputs:
        type: dict
        default:
          everything:
            id: everything
        description: >-
          Journald inputs, keyed by a free name. Each entry has an id and optional
          include_matches filters. See the Filebeat inputs documentation.

      beats_filebeat_docker:
        type: bool
        default: false
        description: Collect Docker container logs. Only works on Elastic Stack release 7.

      beats_filebeat_docker_ids:
        type: str
        default: "*"
        description: IDs of the containers to collect logs from.

      beats_filebeat_mysql_slowlog_input:
        type: bool
        default: false
        description: Collect the MySQL/MariaDB slow query log, including multiline handling.

      beats_filebeat_modules:
        type: list
        elements: str
        description: List of Filebeat modules to enable (experimental). Unset by default.

      # ----- Auditbeat -----
      beats_auditbeat_enable:
        type: bool
        default: true
        description: Start and enable the Auditbeat service.

      beats_auditbeat_output:
        type: str
        choices:
          - logstash
          - elasticsearch
        default: elasticsearch
        description: >-
          Where Auditbeat sends its events. Defaults to "elasticsearch" because audit events
          already arrive structured and gain nothing from passing through Logstash. Set it to
          "logstash" to route them through the pipelines anyway.

      beats_auditbeat_setup:
        type: bool
        default: true
        description: >-
          Run the Auditbeat setup (index management, ingest pipelines and Kibana
          dashboards). Only effective with the elasticsearch output; loading the
          dashboards additionally requires Kibana to be reachable.

      beats_auditbeat_loadbalance:
        type: bool
        default: true
        description: Enable load balancing for the Auditbeat Logstash output.

      # ----- Metricbeat -----
      beats_metricbeat_enable:
        type: bool
        default: true
        description: Start and enable the Metricbeat service.

      beats_metricbeat_output:
        type: str
        choices:
          - logstash
          - elasticsearch
        default: elasticsearch
        description: >-
          Where Metricbeat sends its events. Defaults to "elasticsearch" because metrics
          already arrive structured and gain nothing from passing through Logstash. Set it to
          "logstash" to route them through the pipelines anyway.

      beats_metricbeat_modules:
        type: list
        elements: str
        default:
          - system
        description: Metricbeat modules to enable.

      beats_metricbeat_loadbalance:
        type: bool
        default: true
        description: Enable load balancing for the Metricbeat Logstash output.

      # ----- Security / TLS -----
      beats_security:
        type: bool
        default: false
        description: >-
          Activate TLS for the connections to the targets. Works with the other
          roles and elasticstack_full_stack to create certificates automatically,
          or with the beats_tls_* variables for custom certificates.

      beats_ca_dir:
        type: str
        description: >-
          Base directory for the Beats certificate, key and CA file. The role
          fills it per variant (/opt/ca standalone, /etc/beats/certs in a full
          stack) if you did not set it. In a full stack the role writes the
          generated certificate, key and CA there, and a certificate renewal
          copies the directory to a backup and deletes it. Point it at a
          directory that holds nothing else.

      beats_tls_key:
        type: str
        default: "{{ beats_ca_dir | default('') }}/{{ inventory_hostname }}-beats.key"
        description: Path to the Beats private key. Defaults under beats_ca_dir; set it to bring your own.

      beats_tls_cert:
        type: str
        default: "{{ beats_ca_dir | default('') }}/{{ inventory_hostname }}-beats.crt"
        description: Path to the Beats certificate. Defaults under beats_ca_dir; set it to bring your own.

      beats_tls_cacert:
        type: str
        default: "{{ beats_ca_dir | default('') }}/ca.crt"
        description: Path to the CA certificate Beats trusts. Defaults under beats_ca_dir; set it to bring your own.

      beats_tls_key_passphrase:
        type: str
        default: BeatsChangeMe
        description: Passphrase of the Beats private key.

      beats_ssl_verification_mode:
        type: str
        default: full
        choices:
          - full
          - strict
          - certificate
          - none
        description: >-
          How the Beats verify the certificate of Elasticsearch when they ship to it over TLS, and
          of Kibana when they load their dashboards over https (ssl.verification_mode). full checks
          the CA and that the host name or IP is in the certificate. certificate checks only the
          CA, for certificates without the address the Beats connect to. none turns the check off.

      beats_ssl_certificate_authorities:
        type: list
        elements: str
        default: []
        description: >-
          CA certificates the Beats check the certificate of Elasticsearch against, as paths on
          the Beats hosts, and the certificate of Kibana unless
          beats_kibana_ssl_certificate_authorities is set. Leave it empty to let the role decide.
          With elasticstack_full_stack true it uses the CA the collection created
          (beats_tls_cacert). With elasticstack_full_stack false it sets no CA, and the Beats trust
          the CAs installed in the operating system. That is enough when Elasticsearch and Kibana
          have certificates from a public CA, for example on Elastic Cloud.

      beats_elasticsearch_username:
        type: str
        default: ""
        description: >-
          User the Beats log in to Elasticsearch and Kibana with. When empty, a full stack uses the
          elastic user. Required with beats_elasticsearch_password when elasticstack_full_stack is
          false, beats_security is true and no beats_elasticsearch_api_key is set.

      beats_elasticsearch_password:
        type: str
        default: ""
        description: >-
          Password of beats_elasticsearch_username. When empty, a full stack uses the generated
          password of the elastic user.

      beats_elasticsearch_api_key:
        type: str
        default: ""
        description: >-
          API key the Beats log in to Elasticsearch and Kibana with, as id:api_key. When set, the
          Beats use it instead of beats_elasticsearch_username and beats_elasticsearch_password.

      beats_kibana_host:
        type: str
        default: ""
        description: >-
          URL of the Kibana the Beats load their dashboards into (setup.kibana.host), with http://
          or https://, for example https://kibana.example.com:5601. When empty, a full stack uses
          https with the first host of the inventory group named in elasticstack_kibana_group_name,
          picked by elasticstack_address_mode and elasticstack_node_address, and
          elasticstack_kibana_port, as Kibana uses TLS there by default. Set it to the http URL
          when kibana_tls is false in a full stack. Without a full stack the role writes no
          setup.kibana then, and a Beat that loads dashboards uses its default 127.0.0.1:5601. With
          beats_security true the Beats log in with the credentials they use for Elasticsearch.
          Over https they check the certificate of Kibana with beats_ssl_verification_mode and
          beats_kibana_ssl_certificate_authorities.

      beats_kibana_ssl_certificate_authorities:
        type: list
        elements: str
        default: []
        description: >-
          CA certificates the Beats check the certificate of Kibana against, as paths on the Beats
          hosts. When empty, the Beats use the same CAs as for Elasticsearch, see
          beats_ssl_certificate_authorities. Set it when Kibana has a certificate from another CA
          than Elasticsearch, for example an own certificate set with kibana_tls_cert in a full
          stack.

      beats_cert_validity_period:
        type: int
        default: 1095
        description: Number of days the generated certificates are valid.

      beats_cert_expiration_buffer:
        type: str
        default: "+30d"
        description: >-
          Renew the certificate when it would expire within this period. Uses the
          community.crypto check_period format (e.g. "+30d"), not a plain number.

      beats_cert_will_expire_soon:
        type: bool
        default: false
        description: >-
          Set to true to force renewal of the Beats certificate. Alternatively run
          the playbook with the renew_beats_cert tag.
