---

- name: Include global role
  ansible.builtin.import_role:
    name: netways.elasticstack.elasticstack
  when: not hostvars[inventory_hostname]._elasticstack_role_imported | default(false)

- name: Update apt cache.
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 600
  changed_when: false
  when: ansible_os_family == 'Debian'

- name: Prepare for whole stack roles if used
  when:
    - elasticstack_full_stack | bool
  block:
    - name: Enable security if enabled for whole stack
      ansible.builtin.set_fact:
        beats_security: true
      when:
        - elasticstack_security | bool
        - elasticstack_variant != "oss"
        - not elasticstack_override_beats_tls | bool

    - name: Set beats_ca_dir if whole stack is used
      ansible.builtin.set_fact:
        beats_ca_dir: "/etc/beats/certs"
      when:
        - elasticstack_security | bool
        - beats_ca_dir is undefined

# We need it for templating even when security is disabled
# This default corresponds with the default in Elastic-
# independent "CA" Role

- name: Set beats_ca_dir if whole stack is not used
  ansible.builtin.set_fact:
    beats_ca_dir: "/opt/ca"
  when:
    - beats_ca_dir is undefined
  tags:
    - certificates
    - renew_ca
    - renew_beats_cert

- name: Create directory for logging if file logging is activated
  ansible.builtin.file:
    path: "{{ beats_logpath }}"
    state: directory
    owner: root
    group: root
    mode: 0750
  when: beats_logging == "file"

- name: Import security tasks
  ansible.builtin.import_tasks: beats-security.yml
  when:
    - beats_security | bool
    - elasticstack_full_stack | bool
    - elasticstack_variant == "elastic"
  tags:
    - certificates
    - renew_ca
    - renew_beats_cert

- name: Set the Elasticsearch hosts the Beats ship to
  ansible.builtin.set_fact:
    beats_elasticsearch_hosts: >-
      {{ groups[elasticstack_elasticsearch_group_name] | default([])
         if elasticstack_full_stack | bool else [] }}
  when: beats_elasticsearch_hosts is undefined
  tags: always

- name: Set the Logstash hosts the Beats ship to
  ansible.builtin.set_fact:
    beats_logstash_hosts: >-
      {{ groups[elasticstack_logstash_group_name] | default([])
         if elasticstack_full_stack | bool else [] }}
  when: beats_logstash_hosts is undefined
  tags: always

- name: Check that every enabled Beat has hosts to ship to
  ansible.builtin.assert:
    that: __beats_output_hosts | length > 0
    fail_msg: >-
      {{ item.variable }} is set to "{{ item.output }}", but {{ __beats_output_hosts_variable }} is
      empty. {{ __beats_output_source }}
    quiet: true
  vars:
    __beats_output_hosts: "{{ beats_logstash_hosts if item.output == 'logstash' else beats_elasticsearch_hosts }}"
    __beats_output_hosts_variable: "{{ 'beats_logstash_hosts' if item.output == 'logstash' else 'beats_elasticsearch_hosts' }}"
    __beats_output_group: "{{ elasticstack_logstash_group_name if item.output == 'logstash' else elasticstack_elasticsearch_group_name }}"
    __beats_output_source: >-
      {{ 'elasticstack_full_stack is true, so it is filled from the inventory group "'
         ~ __beats_output_group ~ '" unless you set it.'
         if elasticstack_full_stack | bool
         else 'elasticstack_full_stack is false, so you have to set it.' }}
  loop:
    - variable: beats_filebeat_output
      enabled: "{{ beats_filebeat }}"
      output: "{{ beats_filebeat_output.type | default(beats_filebeat_output) }}"
    - variable: beats_auditbeat_output
      enabled: "{{ beats_auditbeat }}"
      output: "{{ beats_auditbeat_output.type | default(beats_auditbeat_output) }}"
    - variable: beats_metricbeat_output
      enabled: "{{ beats_metricbeat }}"
      output: "{{ beats_metricbeat_output.type | default(beats_metricbeat_output) }}"
  loop_control:
    label: "{{ item.variable }}"
  when:
    - item.enabled | bool
    - item.output in ['logstash', 'elasticsearch']
  tags:
    - configuration
    - beats_configuration
    - beats_filebeat_configuration
    - beats_auditbeat_configuration

- name: Import Filebeat tasks
  ansible.builtin.import_tasks: filebeat.yml
  when: beats_filebeat | bool

- name: Import Auditbeat tasks
  ansible.builtin.import_tasks: auditbeat.yml
  when: beats_auditbeat | bool

- name: Import Metricbeat tasks
  ansible.builtin.import_tasks: metricbeat.yml
  when: beats_metricbeat | bool

# Free up some space to let elsticsearch allocate replica in GitHub Action
- name: Remove cache
  ansible.builtin.command: >
    rm -rf /var/cache/*
  changed_when: false
  when: elasticstack_ci | bool
