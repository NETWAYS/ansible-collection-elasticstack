---

- name: Check for versions
  ansible.builtin.fail:
    msg: "No OSS package with version later than 7 is available for Kibana"
  when:
    - elasticstack_release | int > 7
    - elasticstack_variant == "oss"

- name: Include global role
  ansible.builtin.import_role:
    name: netways.elasticstack.elasticstack

- name: Update apt cache.
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 600
  changed_when: false
  when: ansible_os_family == 'Debian'

- name: Set common password for common certificates
  ansible.builtin.set_fact:
    kibana_tls_key_passphrase: "{{ elasticstack_cert_pass }}"
  when:
    - elasticstack_cert_pass is defined
  tags: always

- name: Set Elasticsearch hosts if used with other roles
  ansible.builtin.set_fact:
    kibana_elasticsearch_hosts: "{{ groups[elasticstack_elasticsearch_group_name] | map('extract', __elasticstack_node_address) | list }}"
  when:
    - kibana_elasticsearch_hosts is undefined
    - groups[elasticstack_elasticsearch_group_name] is defined
  tags: always

- name: Set Elasticsearch hosts to localhost if no other info is available
  ansible.builtin.set_fact:
    kibana_elasticsearch_hosts:
      - localhost
  when:
    - kibana_elasticsearch_hosts is undefined
    - groups[elasticstack_elasticsearch_group_name] is undefined
  tags: always

# Not tagged always: elasticstack_versionseparator comes from the OS vars, which the elasticstack
# role loads in an untagged task. In a run with --tags it is missing, and the task fails as soon
# as elasticstack_version is set.
- name: Construct exact name of Kibana package
  ansible.builtin.set_fact:
    kibana_package: >-
      {{
      'kibana' +
      ('-oss' if elasticstack_variant == 'oss' else '') +
      ((elasticstack_versionseparator +
      elasticstack_version |
      string ) if (elasticstack_version is defined and elasticstack_version | length > 0)) |
      replace(' ', '') }}

- name: Install Kibana - rpm - full stack
  ansible.builtin.package:
    name: "{{ kibana_package }}"
    state: present
    enablerepo:
      - 'elastic-{% if elasticstack_variant == "oss" %}oss-{% endif %}{{ elasticstack_release }}.x'
  notify:
    - Restart Kibana
  when:
    - ansible_os_family == "RedHat"
    - elasticstack_full_stack | bool

- name: Install Kibana - rpm - standalone
  ansible.builtin.package:
    name: "{{ kibana_package }}"
    state: present
  notify:
    - Restart Kibana
  when:
    - ansible_os_family == "RedHat"
    - not elasticstack_full_stack | bool

- name: Install Kibana - deb
  ansible.builtin.package:
    name: "{{ kibana_package }}"
    state: present
  notify:
    - Restart Kibana
  when:
    - ansible_os_family == "Debian"

- name: Import security related tasks
  ansible.builtin.import_tasks: kibana-security.yml
  when:
    - elasticstack_full_stack is defined
    - elasticstack_full_stack | bool
    - kibana_security | bool
    - elasticstack_variant == "elastic"
  tags:
    - certificates
    - renew_ca
    - renew_kibana_cert

- name: Create directory for logging if file logging is activated
  ansible.builtin.file:
    path: "{{ kibana_logpath }}"
    state: directory
    owner: kibana
    group: kibana
    mode: 0750
  when: kibana_manage_logging | bool

- name: Configure Kibana
  ansible.builtin.template:
    src: kibana.yml.j2
    dest: /etc/kibana/kibana.yml
    owner: root
    group: root
    mode: 0644
    backup: "{{ kibana_config_backup }}"
  notify:
    - Restart Kibana
  when: kibana_manage_yaml | bool

- name: Start Kibana
  ansible.builtin.service:
    name: kibana
    state: started
    enabled: yes
  when: kibana_enable | bool
  register: kibana_freshstart

# A task above notified "Restart Kibana". Run the notified handlers now and not at the end of
# the play, so that the waits below see the restarted Kibana and a later play, such as the
# beats role, does not find it down. After a fresh start the handler skips the restart.
- name: Run the handlers notified so far, before waiting for Kibana
  ansible.builtin.meta: flush_handlers
  tags:
    - certificates
    - renew_ca
    - renew_kibana_cert

- name: Wait for Kibana to start (with debug)
  when: kibana_enable | bool
  tags:
    - certificates
    - renew_ca
    - renew_kibana_cert
  block:
    - name: Wait for Kibana to start
      ansible.builtin.wait_for:
        host: localhost
        port: 5601
        timeout: 300
      register: kibana_wait

    # An open port only means Kibana is starting; /api/status returns 503 ("not
    # ready yet") until it is fully up, so downstream consumers (e.g. Beats
    # dashboard setup) must not race it. Poll unauthenticated: a ready Kibana
    # answers 200 (anonymous status allowed) or 401 (auth required but server up)
    # depending on status.allowAnonymous and the version. Treat both as ready.
    - name: Wait for Kibana API to be ready
      ansible.builtin.uri:
        url: "{{ 'https' if kibana_tls | bool else 'http' }}://localhost:{{ elasticstack_kibana_port }}/api/status"
        method: GET
        validate_certs: false
        status_code: [200, 401, 503]
      register: kibana_api
      until: kibana_api.status in [200, 401]
      retries: 60
      delay: 5
      changed_when: false
  rescue:
    - name: Show why the Kibana readiness check failed
      ansible.builtin.debug:
        msg: >-
          Kibana readiness failed.
          API check: status={{ kibana_api.status | default('n/a') }},
          msg={{ kibana_api.msg | default('n/a') }}.
          Port opened after {{ kibana_wait.elapsed | default('n/a') }}s.
    - name: Show Kibana warnings and errors
      ansible.builtin.command:
        cmd: journalctl -u kibana -n 100 -p warning
      register: kibana_logs
      changed_when: false
      no_log: true
    - name: Output Kibana warnings and errors
      ansible.builtin.debug:
        var: kibana_logs.stdout

# Free up some space to let elsticsearch allocate replica in GitHub Action
- name: Remove cache
  ansible.builtin.command: >
    rm -rf /var/cache/*
  changed_when: false
  when: elasticstack_ci | bool
