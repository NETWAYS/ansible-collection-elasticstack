---
# Kibana serves the certificate that the role creates from the stack CA, unless an own certificate
# is set. The role creates it only in a full stack with kibana_security, see tasks/main.yml.
_kibana_tls_generated: >-
  {{ kibana_tls_cert | length == 0
     and kibana_tls_key | length == 0
     and elasticstack_full_stack | default(false) | bool
     and kibana_security | bool
     and elasticstack_variant == 'elastic' }}
